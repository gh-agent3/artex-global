# Minimal working stack for the ARTEX platform: PostgreSQL + the artex service.
# Images are pinned by immutable digest (postgres) and by the binary-hash tag
# (artex-local, produced by build-image.sh) per the supply-chain pinning rules.
#
#   ./build-image.sh .
#   # pin the exact binary: compose reads the image name from ARTEX_IMAGE
#   ARTEX_IMAGE=artex-local:<short-sha>-<hash> docker compose up -d
#
# Then open http://127.0.0.1:8787 (health: GET /api/health).

services:
  postgres:
    image: postgres:16-alpine@sha256:cbf42f0edc946c0bc1b8eeed62403734e1f25dc67a3491455d07a92fdb558b28
    environment:
      POSTGRES_USER: artex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artex-local-dev}
      POSTGRES_DB: artex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artex -d artex"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  artex:
    image: ${ARTEX_IMAGE:?set ARTEX_IMAGE to an artex-local tag from build-image.sh}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://artex:${POSTGRES_PASSWORD:-artex-local-dev}@postgres:5432/artex?sslmode=disable
      TMPDIR: /app/data/tmp
      HOME: /app/data/home
    ports:
      - "8787:8787"
    volumes:
      - artex-data:/app/data
    restart: unless-stopped

volumes:
  pgdata:
  artex-data:
